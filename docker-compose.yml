services:
    postgres:
        image: postgres:17
        container_name: aria-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: aria
            POSTGRES_USER: aria
            POSTGRES_PASSWORD: aria_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U aria -d aria']
            interval: 5s
            timeout: 5s
            retries: 10

    redlib:
        image: tagliasteel/redlib
        container_name: aria-redlib
        restart: unless-stopped
        environment:
            REDLIB_DEFAULT_SHOW_NSFW: 'on'
            REDLIB_DEFAULT_USE_HLS: 'on'
            REDLIB_DEFAULT_HIDE_HLS_NOTIFICATION: 'on'
            REDLIB_ROBOTS_DISABLE_INDEXING: 'on'
            REDLIB_DEFAULT_WIDE: 'off'
        ports:
            - '8080:8080'
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://localhost:8080']
            interval: 30s
            timeout: 5s
            retries: 3

    wa-sidecar:
        hostname: wa-sidecar-fixed
        build:
            context: ./wa_sidecar
            dockerfile: Dockerfile
        container_name: aria-wa-sidecar
        restart: unless-stopped
        volumes:
            - wa_auth:/app/.wwebjs_auth
        ports:
            - '3333:3333'

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: aria-backend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            REDLIB_URL: http://aria-redlib:8080
            REDLIB_PUBLIC_URL: http://localhost:8080
            WHATSAPP_SIDECAR_URL: http://aria-wa-sidecar:3333
        depends_on:
            postgres:
                condition: service_healthy
            redlib:
                condition: service_started
            wa-sidecar:
                condition: service_started
        ports:
            - '8000:8000'

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: http://localhost:8000
        container_name: aria-frontend
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - '80:80'

volumes:
    postgres_data:
    wa_auth:
